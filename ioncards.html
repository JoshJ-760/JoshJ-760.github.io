<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>Ion Cards — Ionic Bonding Lab</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f4ef;
    }
    * { box-sizing: border-box; }
    html, body, #lab { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { min-width: 320px; }
    #lab { display: block; touch-action: none; outline: none; }
  </style>
</head>
<body>
  <div id="lab" aria-label="Ion Cards ionic bonding lab. Drag ions onto the board, then connect opposite charge ports."></div>
  <script src="https://cdn.jsdelivr.net/npm/konva@9.3.18/konva.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
